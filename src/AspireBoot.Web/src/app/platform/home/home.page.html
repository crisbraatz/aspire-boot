<section aria-labelledby="home-heading" class="space-y-6">
  <h1 id="home-heading" class="text-3xl font-bold tracking-tight sm:text-4xl">
    {{ 'home.heading' | t }}
  </h1>
  <p class="max-w-2xl text-lg text-slate-600 dark:text-slate-300">
    {{ 'home.lead' | t }}
  </p>

  <div role="status" aria-live="polite" class="text-sm text-slate-600 dark:text-slate-300">
    @if (appInfo.hasValue()) {
      <span>{{ 'home.apiStatus.online' | t: { version: appInfo.value().version } }}</span>
    } @else if (appInfo.error()) {
      <span>{{ 'home.apiStatus.offline' | t }}</span>
    } @else {
      <span>{{ 'home.apiStatus.checking' | t }}</span>
    }
  </div>
</section>
