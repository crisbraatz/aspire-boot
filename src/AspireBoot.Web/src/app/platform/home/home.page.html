<section aria-labelledby="home-heading" class="space-y-6">
  <h1 id="home-heading" class="text-3xl font-bold tracking-tight sm:text-4xl" i18n="@@home.heading">
    Your idea, secure from day one
  </h1>
  <p class="max-w-2xl text-lg text-slate-600 dark:text-slate-300" i18n="@@home.lead">
    Accounts, permissions and production-grade infrastructure are ready. Focus on your business.
  </p>

  <div role="status" aria-live="polite" class="text-sm text-slate-600 dark:text-slate-300">
    @if (appInfo.hasValue()) {
      <span i18n="@@home.apiStatus.online">API online · version {{ appInfo.value().version }}</span>
    } @else if (appInfo.error()) {
      <span i18n="@@home.apiStatus.offline">API unavailable right now.</span>
    } @else {
      <span i18n="@@home.apiStatus.checking">Checking API status…</span>
    }
  </div>
</section>
