<a
  href="#main"
  class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:rounded-md focus:bg-white focus:px-4 focus:py-2 focus:text-brand-700 focus:shadow dark:focus:bg-slate-900"
  >{{ 'shell.skipToContent' | t }}</a
>

<header class="border-b border-slate-200 dark:border-slate-800">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3">
    <a routerLink="/" class="rounded-md text-lg font-semibold text-brand-700 dark:text-brand-100">{{
      'shell.brand' | t
    }}</a>

    <div class="flex flex-wrap items-center gap-2">
      @if (session.isLoaded() && !session.isSignedIn()) {
        <nav [attr.aria-label]="'shell.nav.account' | t" class="flex items-center gap-1 text-sm">
          <a
            routerLink="/signin"
            class="inline-flex min-h-11 items-center rounded-md px-2 font-medium text-brand-700 underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 dark:text-brand-100"
            >{{ 'shell.nav.signIn' | t }}</a
          >
          <a
            routerLink="/signup"
            class="inline-flex min-h-11 items-center rounded-md px-2 font-medium text-brand-700 underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 dark:text-brand-100"
            >{{ 'shell.nav.signUp' | t }}</a
          >
        </nav>
      }
      @if (session.isLoaded() && session.isSignedIn()) {
        <nav [attr.aria-label]="'shell.nav.account' | t" class="flex items-center gap-1 text-sm">
          <a
            routerLink="/account"
            class="inline-flex min-h-11 items-center rounded-md px-2 font-medium text-brand-700 underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 dark:text-brand-100"
            >{{ 'shell.nav.account' | t }}</a
          >
          <button
            type="button"
            data-action="shell-sign-out"
            class="inline-flex min-h-11 items-center rounded-md px-2 font-medium text-brand-700 underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 dark:text-brand-100"
            (click)="signOut()"
          >
            {{ 'shell.nav.signOut' | t }}
          </button>
        </nav>
      }
      <label for="language-select" class="text-sm text-slate-600 dark:text-slate-300">
        {{ 'shell.language.label' | t }}
      </label>
      <select
        id="language-select"
        class="min-h-11 rounded-md border border-slate-300 bg-white px-2 text-sm text-slate-900 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100"
        (change)="onLanguageChange($event)"
      >
        @for (option of cultures; track option) {
          <option [value]="option" [selected]="option === i18n.culture()">
            {{ 'shell.language.' + option | t }}
          </option>
        }
      </select>
    </div>
  </div>
</header>

<main id="main" #main tabindex="-1" class="mx-auto max-w-6xl px-4 py-8 focus:outline-none">
  <router-outlet />
</main>
