name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet format AspireBoot.slnx --verify-no-changes
      - run: dotnet build AspireBoot.slnx -c Release
      - name: Fail on missing EF Core migrations
        run: dotnet ef migrations has-pending-model-changes -p src/AspireBoot.Core -s src/AspireBoot.Api --no-build --configuration Release
      - name: Unit and integration tests (Testcontainers)
        run: dotnet test --solution AspireBoot.slnx -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AspireBoot.Web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/AspireBoot.Web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks CLI over full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: Dependency scan (osv-scanner)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.1 scan source --recursive /src
      - name: Container config scan (trivy)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.2 config --exit-code 1 --severity HIGH,CRITICAL /src
