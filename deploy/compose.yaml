# Production deployment for a single VPS. Works with `docker compose` and `podman compose`.
# Usage (from the repository root):
#   cp deploy/.env.example deploy/.env   # then fill it
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
name: aspireboot

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  networks: [backend]

x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: Production
  AllowedHosts: ${APP_DOMAIN}
  ReverseProxy__KnownNetworks__0: 172.30.0.0/24
  App__PublicBaseUrl: https://${APP_DOMAIN}
  Passkeys__ServerDomain: ${APP_DOMAIN}
  Passkeys__AllowedOrigins__0: https://${APP_DOMAIN}
  ConnectionStrings__aspireboot: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Keepalive=30;Tcp Keepalive=true
  ConnectionStrings__rabbitmq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  ConnectionStrings__redis: redis:6379,password=${REDIS_PASSWORD}
  Storage__ServiceUrl: http://rustfs:9000
  Storage__AccessKey: ${STORAGE_ACCESS_KEY}
  Storage__SecretKey: ${STORAGE_SECRET_KEY}
  Storage__Bucket: ${STORAGE_BUCKET}
  Email__Host: ${EMAIL_HOST}
  Email__Port: ${EMAIL_PORT}
  Email__UseTls: "true"
  Email__Username: ${EMAIL_USERNAME}
  Email__Password: ${EMAIL_PASSWORD}
  Email__FromAddress: ${EMAIL_FROM_ADDRESS}
  Email__FromName: ${EMAIL_FROM_NAME}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  caddy:
    <<: *hardening
    build: { context: .., dockerfile: deploy/Dockerfile.caddy }
    image: aspireboot-caddy:latest
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes: [caddy_data:/data, caddy_config:/config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      api: { condition: service_healthy }

  migrator:
    # One-shot: applies EF Core migrations, then Wolverine resources are created by `resources setup`.
    build: { context: .., dockerfile: src/AspireBoot.Api/Dockerfile }
    image: aspireboot-api:latest
    restart: "no"
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment: *app-env
    entrypoint: ["/bin/sh", "-c", "./efbundle --connection \"$$ConnectionStrings__aspireboot\" && dotnet AspireBoot.Api.dll resources setup"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  api:
    <<: *hardening
    image: aspireboot-api:latest
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment: *app-env
    healthcheck:
      # The .NET runtime image has no curl/wget; bash's /dev/tcp is enough for a local probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      migrator: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rustfs: { condition: service_started }

  worker:
    <<: *hardening
    build: { context: .., dockerfile: src/AspireBoot.Worker/Dockerfile }
    image: aspireboot-worker:latest
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment: *app-env
    healthcheck:
      # The .NET runtime image has no curl/wget; bash's /dev/tcp is enough for a local probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      migrator: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  postgres:
    <<: *hardening
    image: postgres:19.0-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    <<: *hardening
    image: rabbitmq:4.4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    <<: *hardening
    image: redis:8.12.0-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  rustfs:
    <<: *hardening
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
    volumes: [rustfs_data:/data]

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  rabbitmq_data:
  redis_data:
  rustfs_data:
